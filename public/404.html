<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      sessionStorage.setItem(
        "redirectPath",
        window.location.pathname +
          window.location.search +
          window.location.hash,
      );
      window.location.replace("/");
    </script>
  </head>
  <body></body>
</html>
